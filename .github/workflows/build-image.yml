name: Build and push image
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Lint + tests unitaires : l'image n'est construite que si tout passe.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Dépendances (dont le groupe dev)
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Tests (pytest)
        run: uv run pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest   # runner amd64 : l'image tourne directement sur le cluster K3S
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/isos-civictech/isos-data-worker:${{ github.ref_name }}
            ghcr.io/isos-civictech/isos-data-worker:${{ github.sha }}

  # Déploiement continu de l'intégration : écrit le tag de l'image (sha du commit) dans
  # isos-ops/k3s/envs/int/kustomization.yaml ; ArgoCD déploie ensuite tout seul.
  deploy-int:
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Mettre à jour le tag de l'intégration dans isos-ops
        env:
          KEY: ${{ secrets.ISOS_OPS_DEPLOY_KEY }}
          IMG: ghcr.io/isos-civictech/isos-data-worker
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone -q --depth 5 git@github.com:isos-civictech/isos-ops.git ops && cd ops
          git config user.name "isos-ci" && git config user.email "isos-ci@users.noreply.github.com"
          F=k3s/envs/int/kustomization.yaml
          # Les 3 repos peuvent pousser en même temps : on réessaie après un rebase.
          for i in 1 2 3 4 5; do
            git pull -q --rebase
            sed -i "\#name: $IMG\$#{n;s#newTag: .*#newTag: $GITHUB_SHA#}" "$F"
            if git diff --quiet; then echo "tag déjà à jour"; exit 0; fi
            git commit -qam "deploy(int): ${IMG##*/} ${GITHUB_SHA::7}" && git push -q && { echo "intégration → ${GITHUB_SHA::7}"; exit 0; }
            git reset -q --hard origin/main; sleep $((i * 3))
          done
          exit 1
