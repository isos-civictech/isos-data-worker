# Postgres is NOT declared here on purpose.
#
# The worker writes into the same database as isos-api, with the least-privilege
# role `isos_ingestion` created by isos-api/docker/postgres/initdb. A second,
# bare Postgres would have neither those roles, nor the `public` content tables
# the projection writes to — it would test against a database that does not
# resemble production.
#
#   cd ../isos-api && docker compose up -d db
#
# Both stacks share the external `isos-network`, so the host name is `db`.

services:
  garage:
    image: dxflrs/garage:v1.0.1
    container_name: isos-garage
    restart: unless-stopped
    # The config DIRECTORY is mounted, not the file: on Docker Desktop a
    # single-file bind mount breaks as soon as an editor saves it (new inode).
    command: ["/garage", "-c", "/etc/garage/garage.toml", "server"]
    volumes:
      - ./docker/garage:/etc/garage:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - "3900:3900"          # S3 API
      - "3903:3903"          # admin
    networks:
      - isos-network


  scraper:
    container_name: isos-scraper
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # .env targets the host; inside compose the services are reachable by name.
      DATABASE_URL: postgresql+asyncpg://isos_ingestion:${ISOS_INGESTION_DB_PASSWORD}@db:5432/${POSTGRES_DB:-isos_db}
      S3_ENDPOINT: http://garage:3900
    ports:
      - "8001:8001"
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
    depends_on:
      garage:
        condition: service_started
    networks:
      - isos-network

volumes:
  garage-meta:
  garage-data:

networks:
  isos-network:
    external: true
